[project]
name = "tools"
version = "0.2.0"
description = "A collection of CLI tools"
readme = {file = "README.org", content-type = "text/org"}
license = {file = "LICENSE"}
authors = [
    { name = "Brett Viren", email = "brett.viren@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "tomlkit>=0.12",
    "click-man>=0.4",
    "numpy>=2.5.3",
    "pathspec>=1.1.1",
]

[project.scripts]
tools = "tools:main"
manycron = "tools.manycron:cli"
cmake-examine = "tools.cmake_examine:cli"
bds = "tools.bds:cli"
loop = "tools.loop:main"
fix = "tools.fix.__main__:main"
kitty-open = "tools.kitty_open:main"
gitea-mirror = "tools.gitea_mirror.__main__:main"
egs = "tools.egs.__main__:main"

[project.optional-dependencies]
transformers = [
    "av>=19.0.1",
    "librosa>=1.0.0",
    "pillow>=12.3.0",
    "sentence-transformers>=6.1.0",
    "soundfile>=0.14.0",
    "torch",
    "torchcodec>=0.17.0",
    "torchvision>=0.29.1",
    "transformers>=5.19",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
script-files = [
             "scripts/kfz", "scripts/claude-context-settings",
             "scripts/down", "scripts/bee",
             "scripts/kitty-agent-title", 
             "scripts/kitty-flip", 
             "scripts/bwrap-cwd",
             "scripts/hclaude"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tools = ["bundled_summaries.json"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]



# Driver-compatible CUDA 12.x wheels; PyPI torch is built for CUDA 13.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
