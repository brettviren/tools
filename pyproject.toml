[project]
name = "tools"
version = "0.2.0"
description = "A collection of CLI tools"
readme = {file = "README.org", content-type = "text/org"}
license = {file = "LICENSE"}
authors = [
    { name = "Brett Viren", email = "brett.viren@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "tomlkit>=0.12",
    "click-man>=0.4",
]

[project.scripts]
tools = "tools:main"
manycron = "tools.manycron:cli"
cmake-examine = "tools.cmake_examine:cli"
bds = "tools.bds:cli"
loop = "tools.loop:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
script-files = [
             "scripts/kfz", "scripts/claude-context-settings",
             "scripts/down", "scripts/bee", "scripts/kitty-agent-title", "scripts/bwrap-cwd"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tools = ["bundled_summaries.json"]


